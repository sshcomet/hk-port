<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/web-ports/hollow-knight@latest/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | Hollow Knight</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background: #231F20;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;"> LOADING... </div>
    <div hidden id="unity-container" class="unity-desktop">
        <canvas id="unity-canvas"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
        </div>
        <div id="unity-mobile-warning"> WebGL builds are not supported on mobile devices. </div>
    </div>
    <script>
        // Bump this when the port updates (it forces a fresh download).
        const CACHE_NAME = "hk-web-port-v1";
        const TOTAL_MB = 860.36;
        const CONCURRENCY = 6;
        const MAX_RETRIES = 3;

        var loadingText = document.querySelector("#loading-text");
        let loadedBytes = 0;
        let fromCache = false;

        function updateProgress() {
            const mbDone = (loadedBytes / (1024 * 1024)).toFixed(2);
            const label = fromCache ? "LOADING FROM CACHE" : "DOWNLOADING (first time only)";
            loadingText.textContent = `${label}... ${mbDone} MB / ${TOTAL_MB} MB`;
        }

        // Cache Storage needs a secure context (https or localhost).
        async function openCache() {
            try {
                if (!("caches" in window)) return null;
                if (location.search.includes("clearcache")) {
                    await caches.delete(CACHE_NAME);
                }
                // Ask the browser not to evict our data when disk is low.
                if (navigator.storage && navigator.storage.persist) {
                    navigator.storage.persist().catch(() => {});
                }
                return await caches.open(CACHE_NAME);
            } catch (e) {
                console.warn("Cache unavailable, falling back to normal download:", e);
                return null;
            }
        }

        async function downloadPart(url) {
            let attempt = 0;
            while (true) {
                let received = 0;
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
                    const reader = response.body.getReader();
                    const chunks = [];
                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        chunks.push(value);
                        received += value.length;
                        loadedBytes += value.length;
                        updateProgress();
                    }
                    return new Blob(chunks);
                } catch (e) {
                    loadedBytes -= received; // undo progress for the failed attempt
                    if (++attempt >= MAX_RETRIES) throw e;
                    await new Promise(r => setTimeout(r, 1000 * attempt));
                }
            }
        }

        async function getPart(cache, partPath) {
            const url = new URL(partPath, document.baseURI).href;
            if (cache) {
                try {
                    const hit = await cache.match(url);
                    if (hit) {
                        const blob = await hit.blob();
                        loadedBytes += blob.size;
                        fromCache = true;
                        updateProgress();
                        return blob;
                    }
                } catch (e) { /* fall through to download */ }
            }
            const blob = await downloadPart(url);
            if (cache) {
                try {
                    // Each part is stored as soon as it finishes, so an
                    // interrupted download resumes where it left off.
                    await cache.put(url, new Response(blob));
                } catch (e) {
                    console.warn("Could not cache part (quota?):", url, e);
                }
            }
            return blob;
        }

        async function mergeFiles(cache, fileParts) {
            const blobs = new Array(fileParts.length);
            let next = 0;
            async function worker() {
                while (true) {
                    const i = next++;
                    if (i >= fileParts.length) return;
                    blobs[i] = await getPart(cache, fileParts[i]);
                }
            }
            await Promise.all(Array.from({ length: CONCURRENCY }, worker));
            return URL.createObjectURL(new Blob(blobs));
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) {
                parts.push(file + ".part" + i);
            }
            return parts;
        }

        (async () => {
            const cache = await openCache();
            // Sequential on purpose: keeps the number of simultaneous requests bounded.
            const dataUrl = await mergeFiles(cache, getParts("Build/hk.data", 1, 42));
            const wasmurl = await mergeFiles(cache, getParts("Build/hk.wasm", 1, 2));

            var buildUrl = "Build";
            var loaderUrl = buildUrl + "/hk.loader.js";
            var config = {
                dataUrl: dataUrl,
                frameworkUrl: buildUrl + "/hk.framework.js",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Team Cherry & Truffled",
                productName: "Hollow Knight",
                productVersion: "1.0",
            };
            var container = document.querySelector("#unity-container");
            container.hidden = false;
            var canvas = document.querySelector("#unity-canvas");
            var loadingBar = document.querySelector("#unity-loading-bar");
            var progressBarFull = document.querySelector("#unity-progress-bar-full");
            var mobileWarning = document.querySelector("#unity-mobile-warning");
            if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
                container.className = "unity-mobile";
                config.devicePixelRatio = 1;
                mobileWarning.style.display = "block";
                setTimeout(() => {
                    mobileWarning.style.display = "none";
                }, 5000);
            } else {
                function resizeCanvas() {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                    canvas.style.width = window.innerWidth + "px";
                    canvas.style.height = window.innerHeight + "px";
                }
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);
            }
            loadingBar.style.display = "block";
            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    progressBarFull.style.width = 100 * progress + "%";
                }).then(() => {
                    loadingText.remove();
                    loadingBar.style.display = "none";
                    canvas.style.display = "block";
                }).catch((message) => {
                    alert(message);
                });
            };
            document.body.appendChild(script);
        })();
    </script>
</body>

</html>
